##############################################################
name: LF-AutoTools
version: ${version}
main: com.lfstudios.autotools.LFAutoTools
api-version: '1.21'
folia-supported: false
authors: [LF Studios]
softdepend: [Vault, ShopGUIPlus, AdvancedEnchantments, ItemsAdder, Nexo, AdvancedChests, WorldGuard]
commands:
  autogui:
    permission: lfautotools.autogui
  autosort:
    permission: lfautotools.autosort
  autosell:
    permission: lfautotools.autosell
  autosmelt:
    permission: lfautotools.autosmelt
  autocompress:
    permission: lfautotools.autocompress
  autopickup:
    permission: lfautotools.autopickup
  inventory:
    usage: /inventory <link|unlink|push|pull|autopush|filter>
  lfauto:
    usage: /lfauto reload
permissions:
  lfautotools.use: { default: true }
  lfautotools.autogui: { default: true }
  lfautotools.autosell: { default: op }
  lfautotools.autosmelt: { default: op }
  lfautotools.autocompress: { default: op }
  lfautotools.autosort: { default: op }
  lfautotools.autopickup: { default: op }
  lfautotools.inventory.link: { default: op }
  lfautotools.inventory.unlink: { default: op }
  lfautotools.inventory.push: { default: op }
  lfautotools.inventory.pull: { default: op }
  lfautotools.inventory.autopush: { default: op }
  lfautotools.inventory.filter: { default: op }
  lfautotools.admin: { default: op }
  lfautotools.reload: { default: op }
  lfautotools.update.notify: { default: op }
