# Update manager configuration.
update:
  enabled: true
  interval-seconds: 1800
  notify-console: true
  notify-on-join: true
  notify-permission: lfautotools.update.notify
  source:
    # Endpoint must return latest version as plain text, e.g. 1.0.1
    url: ""
