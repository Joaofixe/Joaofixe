# Storage backend. Use SQLITE for simple setups and MYSQL for networks.
storage:
  type: SQLITE
  sqlite:
    file: data.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: lfautotools
    username: root
    password: change-me
    params: "?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  pool:
    minimum-idle: 2
    maximum-pool-size: 8
